<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="For GRC consultancies: register your firm, invite your customers, run their GRC programme, and earn a revenue share"><title>For GRC consultancies: register your firm, invite your customers, run their GRC programme, and earn a revenue share</title><rect x="1.0" y="1" width="306.0" height="248" rx="16" fill="#FAF8FF" stroke="#E4DEF7" stroke-width="1.5"/><g transform="translate(26.0 26) scale(1.6)" fill="none" stroke="#5B3CC4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/></g><text x="76.0" y="54" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#5B3CC4">01 · REGISTER</text><text x="28.0" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1F2328">Register your firm</text><text x="28.0" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#59636E">Sign up your consultancy,</text><text x="28.0" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#59636E">secured with email</text><text x="28.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#59636E">verification and OTP.</text><rect x="325.0" y="1" width="306.0" height="248" rx="16" fill="#FAF8FF" stroke="#E4DEF7" stroke-width="1.5"/><g transform="translate(350.0 26) scale(1.6)" fill="none" stroke="#5B3CC4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></g><text x="400.0" y="54" font-